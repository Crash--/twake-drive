name: E2E resumable uploads

# Runs the Drive suite of linagora/twake-drive#4610 on a stack built from
# Crash--/cozy-stack#7 (35352cdda), which announces resumable_uploads.
on:
  push:
    branches: [ci/e2e-resumable-upload]

permissions:
  contents: read

jobs:
  e2e:
    uses: linagora/twake-drive/.github/workflows/e2e.yml@feat/resumable-upload
    with:
      drive-ref: feat/resumable-upload
      stack-image: ttl.sh/twake-stack-resumable-bfe6d6744ebe:24h
